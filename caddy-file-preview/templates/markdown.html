<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{placeholder "http.request.orig_uri.path"}} - Markdown Preview</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --line: #d0d7de;
      --surface: #f6f8fa;
      --link: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8b949e;
        --line: #30363d;
        --surface: #161b22;
        --link: #58a6ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
    }
    .topbar {
      position: sticky;
      top: 0;
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(8px);
    }
    .topbar .path {
      flex: 1;
      min-width: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .topbar a {
      color: var(--link);
      text-decoration: none;
      font-weight: 600;
    }
    .topbar a:hover { text-decoration: underline; }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }
    article {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      overflow-wrap: anywhere;
    }
    pre, code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    pre {
      overflow: auto;
      padding: 16px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--surface) 70%, var(--bg));
      border: 1px solid var(--line);
    }
    img { max-width: 100%; }
    blockquote {
      margin: 0;
      padding-left: 16px;
      border-left: 4px solid var(--line);
      color: var(--muted);
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 8px 12px;
      text-align: left;
    }
  </style>
</head>
<body>
  {{$path := placeholder "http.request.orig_uri.path"}}
  <nav class="topbar">
    <div class="path">{{$path}}</div>
    <a href="./">Browse Directory</a>
    <a href="{{$path}}?raw=1">View Raw</a>
  </nav>
  <main>
    <article>
      {{markdown (include $path)}}
    </article>
  </main>
</body>
</html>
